<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>3000円チャレンジ</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; }
    
    /* タイトル */
    h1 { margin-bottom: 20px; }

    /* ガチャボタンエリア */
    .btn-container {
      margin-bottom: 30px;
    }
    
    button {
      padding: 12px 24px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 8px;
      border: 1px solid #ccc;
      background-color: #f8f9fa;
    }

    button:hover {
      background-color: #e2e6ea;
    }

    /* 結果全体を縦に並べる設定 */
    #result {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 合計金額の見出し */
    #result h2 {
      margin: 10px 0;
    }

    /* 商品リスト */
    #result ul {
      text-align: left;
      padding-left: 20px;
      margin: 0;
    }
  </style>
</head>
<body>
  <h1>3000円以上の愛を捧げてガチャガチャに参加しよう</h1>

  <!-- 1. ガチャボタン -->
  <div class="btn-container">
    <button onclick="drawGacha()">ガチャガチャか...興奮してきたな</button>
  </div>

  <!-- 2. 結果表示エリア（縦並び） -->
  <div id="result"></div>

  <script>
    const items = [
      { name: "ランダムホログラムカード", price: 660 },
      { name: "ランダムカンバッジ", price: 605 },
      { name: "めじるしアクリルチャーム", price: 990 },
      { name: "アクリルフィギュア", price: 2090 },
      { name: "透けるアクリルスタンド", price: 1320 },
      { name: "アクリルリング", price: 1100 },
      { name: "ホログラムアクリルステッキ", price: 1540 },
      { name: "ペアアクリルアート", price: 2650 },
      { name: "硬質カードケースセット", price: 1650 },
      { name: "乾杯ジョッキ", price: 3300 }
    ];

    function drawGacha() {
      let found = false;
      // 判定をしっかり行うため試行回数を増やしています
      for (let i = 0; i < 10000; i++) {
        const k = Math.floor(Math.random() * 6) + 1;
        const selected = [];
        let rejectCombination = false;

        // --- 1. 商品選出（乾杯ジョッキの排出率ダウン） ---
        for (let j = 0; j < k; j++) {
          const item = items[Math.floor(Math.random() * items.length)];
          
          // 「乾杯ジョッキ」が選ばれたら 80% の確率でやり直し（採用率20%）
          if (item.name === "乾杯ジョッキ") {
            if (Math.random() < 0.90) { 
              rejectCombination = true;
              break; 
            }
          }
          selected.push(item);
        }

        // ジョッキ弾きが発生した場合は次の試行へ
        if (rejectCombination) continue;

        // --- 2. 金額判定（3000円に近いほど出やすい） ---
        const totalPrice = selected.reduce((sum, item) => sum + item.price, 0);

        if (totalPrice >= 3000 && totalPrice <= 3999) {
          const diff = totalPrice - 3000;

          // 3000円からの差額が大きいほど確率ダウン
          let acceptRate = 1.0; // 3000〜3349円：100%（最優先）

          if (diff >= 350 && diff < 605) {
            acceptRate = 0.4;  // 3350〜3699円：40%
          } else if (diff >= 605) {
            acceptRate = 0.05; // 3700円以上：5%（激レア）
          }

          // 確率判定で落とされたらやり直し
          if (Math.random() > acceptRate) {
            continue;
          }

          // --- 3. 画面表示 ---
          found = true;
          const counts = {};
          selected.forEach(item => {
            counts[item.name] = (counts[item.name] || 0) + 1;
          });

          let html = `<h2>合計金額 ${totalPrice}円</h2><ul>`;
          for (const [name, count] of Object.entries(counts)) {
            const price = items.find(it => it.name === name).price;
            html += `<li>${name}×${count}個 (${price * count}円)</li>`;
          }
          html += "</ul>";
          document.getElementById("result").innerHTML = html;
          break;
        }
      }

      if (!found) {
        document.getElementById("result").innerHTML = "<p>条件に合う組み合わせが見つかりませんでした。</p>";
      }
    }
  </script>
</body>
</html>
